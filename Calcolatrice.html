<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Calcolatrice Semplice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f2f5;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 250px;
    }
    input, button, .result {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .buttons {
      display: flex;
      gap: 5px;
    }
    .buttons button {
      flex: 1;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="box">
    <h3>Calcolatrice Base</h3>
    
    <!-- I due input di testo -->
    <input type="text" id="n1" placeholder="Numero 1">
    <input type="text" id="n2" placeholder="Numero 2">

    <!-- I 4 tasti delle operazioni -->
    <div class="buttons">
      <button onclick="op='+'">+</button>
      <button onclick="op='-'">-</button>
      <button onclick="op='*'">*</button>
      <button onclick="op='/'">/</button>
    </div>

    <!-- Il quinto tasto (Uguale) -->
    <button onclick="calcola()">=</button>

    <!-- Risultato -->
    <div class="result" id="risultato">Risultato: -</div>
  </div>

  <script>
    let op = null; // Memorizza l'operazione scelta

    function calcola() {
      let n1 = parseFloat(document.getElementById('n1').value);
      let n2 = parseFloat(document.getElementById('n2').value);
      let res = 0;

      if (isNaN(n1) || isNaN(n2)) {
        document.getElementById('risultato').innerText = "Inserisci due numeri!";
        return;
      }

      if (op === '+') res = n1 + n2;
      else if (op === '-') res = n1 - n2;
      else if (op === '*') res = n1 * n2;
      else if (op === '/') res = n2 !== 0 ? n1 / n2 : "Errore (div/0)";
      else {
        document.getElementById('risultato').innerText = "Scegli un'operazione!";
        return;
      }

      document.getElementById('risultato').innerText = "Risultato: " + res;
    }
  </script>

</body>
</html>
