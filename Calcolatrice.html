<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi-Calcolatrice Avanzata</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 340px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
        }

        .inputs-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        /* Griglia flessibile per facilitare future aggiunte di tasti */
        .operations-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #334155;
            border: none;
            border-radius: 8px;
            color: var(--text-color);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #475569;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn.active {
            background-color: var(--primary);
        }

        .btn-equals {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-equals:hover {
            background-color: var(--accent-hover);
        }

        .result-box {
            margin-top: 16px;
            padding: 12px;
            background-color: #0f172a;
            border: 1px dashed var(--border);
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>Calcolatrice Modulare</h2>

        <div class="inputs-group">
            <input type="text" id="val1" class="input-field" placeholder="Stringa 1">
            <input type="text" id="val2" class="input-field" placeholder="Stringa 2">
        </div>

        <div class="operations-grid">
            <button class="btn" onclick="impostaOperatore('+', this)">+</button>
            <button class="btn" onclick="impostaOperatore('-', this)">-</button>
            <button class="btn" onclick="impostaOperatore('*', this)">*</button>
            <button class="btn" onclick="impostaOperatore('/', this)">/</button>
        </div>

        <button class="btn-equals" onclick="eseguiCalcolo()">=</button>

        <div class="result-box" id="displayRisultato">
            Risultato: attendata input...
        </div>
    </div>

    <script>
        let operatoreSelezionato = "";

        function impostaOperatore(op, elementoBtn) {
            operatoreSelezionato = op;
            
            // Gestione visiva del tasto attivo
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            elementoBtn.classList.add('active');
        }

        function eseguiCalcolo() {
            let s1 = document.getElementById("val1").value.trim();
            let s2 = document.getElementById("val2").value.trim();
            let display = document.getElementById("displayRisultato");

            // Validazione base sulle stringhe
            if (s1 === "" || s2 === "") {
                display.innerText = "Errore: Compila entrambi i campi.";
                return;
            }

            if (!operatoreSelezionato) {
                display.innerText = "Errore: Scegli un'operazione.";
                return;
            }

            try {
                // Costruzione dell'espressione in formato stringa da valutare
                // Sostituiamo la virgola con il punto per evitare problemi di sintassi numerica
                let espressione = s1.replace(',', '.') + operatoreSelezionato + s2.replace(',', '.');
                
                // Valutazione tramite eval protetta da try/catch
                let risultato = eval(espressione);

                if (!isFinite(risultato)) {
                    display.innerText = "Errore matematico (es. divisione per zero).";
                    return;
                }

                display.innerHTML = `<strong>Risultato:</strong> ${risultato}`;
            } catch (e) {
                display.innerText = "Errore di sintassi nelle stringhe inserite.";
            }
        }
    </script>

</body>
</html>
